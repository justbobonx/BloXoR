<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>BloXoR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/images/icon.png" type="image/png">
  <script>
    window.VERSION = '0.3.18';
    document.write('<link rel="stylesheet" href="css/style.css?v=' + window.VERSION + '">');
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="orientGate" class="hidden">
      <img src="assets/images/BloXor-Title.png" alt="BloXoR">
    </div>

    <div id="startScreen">
      <img id="startTitle" src="assets/images/BloXor-Title.png" alt="BloXoR">
      <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      <div id="startButtons">
        <button id="newGameButton">PLAY</button>
        <button id="continueButton" class="hidden" disabled>CONTINUE</button>
      </div>
      <div id="startHint">line up O X O · tilt / stick / arrows</div>
      <div id="startVersion"></div>
    </div>

    <div id="playHud" class="hidden"></div>

    <div id="levelSelect" class="panel hidden">
      <div class="panel-title">Levels</div>
      <div id="ls_stats">
        <div id="ls_tot">0</div>
        <div id="ls_beat"></div>
        <div id="ls_open"></div>
        <div id="ls_time"></div>
        <div id="ls_plays"></div>
      </div>
      <div id="ls_list"></div>
      <button type="button" id="sb_mute">sound on</button>
    </div>

    <div id="levelDetail" class="panel hidden">
      <div id="ld_name" class="panel-title"></div>
      <img id="ld_thumb" alt="">
      <div id="ld_desc"></div>
      <div id="ld_stats" class="hidden"></div>
      <div class="row">
        <button type="button" id="ld_back">Back</button>
        <button type="button" id="ld_play">Play</button>
      </div>
    </div>

    <div id="pauseScreen" class="panel hidden">
      <div class="panel-title">Paused</div>
      <div class="col">
        <button type="button" id="ps_resume">Resume</button>
        <button type="button" id="ps_restart">Restart</button>
        <button type="button" id="ps_menu">Level select</button>
      </div>
    </div>

    <div id="scoreView" class="panel hidden">
      <div class="panel-title">Level done</div>
      <div id="sc_score"></div>
      <div id="sc_time"></div>
      <div id="sc_moves"></div>
      <button type="button" id="sc_ok">OK</button>
    </div>
  </div>

  <script>
    document.getElementById('startVersion').textContent = 'v' + window.VERSION;
    [
      'js/Coord.js',
      'js/GfxState.js',
      'js/BitmapManager.js',
      'js/Sprite.js',
      'js/SoundManager.js',
      'js/Blox.js',
      'js/LevelData.js',
      'js/GameSave.js',
      'js/BloxField.js',
      'js/BloxPhysics.js',
      'js/BloxInput.js',
      'js/PuzzleLoader.js',
      'js/LevelIndex.js',
      'js/GameView.js',
      'js/BloXor.js',
      'js/main.js'
    ].forEach(function (src) {
      document.write('<script src="' + src + '?v=' + window.VERSION + '"><\/script>');
    });
  </script>
</body>
</html>
