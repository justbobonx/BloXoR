<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>BloXoR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/images/icon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css?v=0.3.59">
  <style>
    html, body { margin: 0; background: #000; height: 100%; overflow: hidden; }
    #orientGate {
      position: absolute;
      inset: 0;
      z-index: 80;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #orientGate img {
      display: block;
      width: min(72%, 340px);
      height: auto;
      image-rendering: pixelated;
    }
    #orientGate.hidden { display: none !important; }
  </style>
  <script>
    if (window.innerHeight > window.innerWidth) {
      document.documentElement.classList.add('stage-swap');
    }
  </script>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="orientGate">
      <img src="assets/images/BloXor-Title.png" alt="BloXoR">
    </div>

    <div id="startScreen">
      <div id="startBrand">
        <img id="startTitle" src="assets/images/BloXor-Title.png" alt="BloXoR">
        <div id="startTag">a puzzle game with a <i>TILT</i></div>
      </div>
      <div id="startButtons">
        <button id="newGameButton">PLAY</button>
      </div>
      <a id="startEmail" href="https://x.com/just_bob" target="_blank" rel="noopener noreferrer">just_bob@X.com</a>
      <div id="startVersion">v0.3.59</div>
    </div>

    <div id="playHud" class="hidden"></div>

    <div id="levelSelect" class="panel hidden">
      <div id="ls_stats">
        <div class="ls-stat">
          <div class="ls-stat-label">SCORE</div>
          <div id="ls_tot" class="ls-stat-val">0</div>
        </div>
        <div class="ls-stat">
          <div class="ls-stat-label">Lvls Open</div>
          <div id="ls_open" class="ls-stat-val">0</div>
        </div>
        <div class="ls-stat">
          <div class="ls-stat-label">Lvls Comp</div>
          <div id="ls_beat" class="ls-stat-val">0</div>
        </div>
        <div class="ls-stat">
          <div class="ls-stat-label">Tot Time</div>
          <div id="ls_time" class="ls-stat-val">0:00:00</div>
        </div>
        <div class="ls-stat">
          <div class="ls-stat-label">Tot Plays</div>
          <div id="ls_plays" class="ls-stat-val">0</div>
        </div>
      </div>
      <div id="ls_list"></div>
    </div>

    <div id="levelDetail" class="panel hidden">
      <div id="ld_name" class="panel-title"></div>
      <img id="ld_thumb" alt="">
      <div id="ld_desc"></div>
      <div id="ld_stats" class="hidden"></div>
      <div class="row row-center">
        <button type="button" id="ld_back">Back</button>
        <button type="button" id="ld_play">Play</button>
      </div>
    </div>

    <div id="pauseScreen" class="panel compact hidden">
      <div id="ps_title" class="panel-title"></div>
      <div class="col">
        <button type="button" id="ps_resume">Resume</button>
        <button type="button" id="ps_restart">Restart</button>
        <button type="button" id="ps_menu">Level select</button>
        <button type="button" id="ps_mute">sound on</button>
      </div>
    </div>

    <div id="scoreView" class="panel compact hidden">
      <div id="sc_title" class="panel-title"></div>
      <div class="col sc-stats">
        <div id="sc_score" class="sc-stat"></div>
        <div id="sc_time" class="sc-stat"></div>
        <div id="sc_moves" class="sc-stat"></div>
      </div>
      <div class="row row-center">
        <button type="button" id="sc_ok">OK</button>
      </div>
    </div>
  </div>

  <script src="js/Coord.js?v=0.3.59"></script>
  <script src="js/GfxState.js?v=0.3.59"></script>
  <script src="js/BitmapManager.js?v=0.3.59"></script>
  <script src="js/Sprite.js?v=0.3.59"></script>
  <script src="js/SoundManager.js?v=0.3.59"></script>
  <script src="js/Blox.js?v=0.3.59"></script>
  <script src="js/LevelData.js?v=0.3.59"></script>
  <script src="js/GameSave.js?v=0.3.59"></script>
  <script src="js/BloxField.js?v=0.3.59"></script>
  <script src="js/BloxPhysics.js?v=0.3.59"></script>
  <script src="js/BloxInput.js?v=0.3.59"></script>
  <script src="js/PuzzleLoader.js?v=0.3.59"></script>
  <script src="js/LevelIndex.js?v=0.3.59"></script>
  <script src="js/GameView.js?v=0.3.59"></script>
  <script src="js/BloXor.js?v=0.3.59"></script>
  <script src="js/main.js?v=0.3.59"></script>

  <script data-goatcounter="https://justbobonx.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.v5.js"
      crossorigin="anonymous"
      integrity="sha384-atnOLvQb9t+jTSipvd75X2yginT4PjVbqDdlJAmxMm+wYElFmeR6EmLP5bYeoRVQ"></script>
</body>
</html>
